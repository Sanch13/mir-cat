name: Run tests for an open pull request
run-name: "Pull request opened by a @${{ github.actor }} for a branch ${{ github.base_ref }} from ${{ github.head_ref }}"
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

jobs:
  run_tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [ 3.13 ]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache uv files
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('backend/pyproject.toml') }}

      - name: Install dependencies
        working-directory: backend
        run: uv sync

      - name: Add pytest-json-ctrf
        working-directory: backend
        run: uv add pytest-json-ctrf --dev

      - name: Run tests
        run: uv run pytest --ctrf ./ctrf/report.json

      - name: Publish Test Report
        uses: ctrf-io/github-test-reporter@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          report-path: './backend/ctrf/*.json'
          github-report: true
          pull-request-report: true
          insights-report: true
        if: always()
