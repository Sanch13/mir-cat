name: Telegram notification
run-name: "Change in repository"
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed
  workflow_dispatch:

jobs:
  notify:
    environment: bot
    runs-on: ubuntu-latest
    steps:

    - name: Notification of a pull request opening
      uses: proDreams/actions-telegram-notifier@main
      with:
        token: ${{ secrets.BOT_TOKEN }}
        chat_id: ${{ secrets.CHAT_ID }}
        thread_id:  ${{ secrets.TOPIC_ID }}
        status: ${{ job.status }}
        notify_fields: "actor,repository,workflow,branch,commit,repo_with_tag"
