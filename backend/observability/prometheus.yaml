global:
  scrape_interval: 5s # Как часто собирать метрики (для локалки 5с ок, в проде 15с)
  evaluation_interval: 5s

scrape_configs:
  # Задача 1: Собирать метрики с самого Прометеуса (мониторинг мониторинга)
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Задача 2: Собирать метрики с твоего FastAPI
  - job_name: 'fastapi_app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['app:8000'] # 'app' - это имя контейнера в docker-compose
